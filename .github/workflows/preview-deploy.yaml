name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "src/**"
      - "lib/**"
      - "seed/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "cloudflare.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tailwind.config.ts"
      - "tsconfig.json"

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ENV: staging

jobs:
  preview-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Compute preview URL
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
        run: |
          ALIAS="pr-${PR_NUMBER}"
          PREVIEW_URL="https://${ALIAS}-blog-staging.${WORKERS_SUBDOMAIN}.workers.dev"
          echo "alias=${ALIAS}" >> "$GITHUB_OUTPUT"
          echo "url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SITE_URL: ${{ steps.preview.outputs.url }}
        run: pnpm build

      - name: Check Worker package
        run: pnpm exec cf deploy --prebuilt --dry-run --mode staging

      - name: Upload isolated staging preview
        id: upload
        if: vars.EMDASH_PREVIEW_READY == 'true'
        env:
          PREVIEW_ALIAS: ${{ steps.preview.outputs.alias }}
        run: |
          pnpm exec emdash migrate --check --wrangler-config wrangler.jsonc --wrangler-env staging --account-id "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec cf workers versions create --prebuilt --mode staging --preview-alias "$PREVIEW_ALIAS"

      - name: Comment on preview
        if: success()
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_DEPLOYED: ${{ steps.upload.outcome == 'success' }}
        with:
          script: |
            const prNum = context.issue.number;
            const body = process.env.PREVIEW_DEPLOYED === 'true'
              ? `## Preview Deploy\n\n**Status**: :white_check_mark: デプロイ完了\n\n**Preview URL**: ${process.env.PREVIEW_URL}`
              : '## Preview Deploy\n\n**Status**: ビルド検証完了。CMS 用ステージングリソースの準備後にプレビューを公開します。';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes('Preview Deploy'));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const prNum = context.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }}`;
            const body = `## Preview Deploy\n\n**Status**: :x: 検証失敗\n\n詳細は[ワークフローログ](${runUrl})を確認してください。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes('Preview Deploy'));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }
