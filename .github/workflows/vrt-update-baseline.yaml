name: Update VRT Baselines

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to copy snapshots from"
        required: true
        type: string

env:
  R2_BUCKET: blog-vrt
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  update-baseline:
    # PR での VRT を skip 中のため、マージ時の自動更新も止めている (手動実行 workflow_dispatch のみ動く)
    # 復活させるときは以下に戻す:
    # if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.1

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Copy snapshots from PR to baselines
        run: |
          PR_NUM=${{ github.event.pull_request.number || inputs.pr_number }}
          echo "Copying snapshots from PR #${PR_NUM} to baselines..."

          # vrt.spec.ts の toHaveScreenshot() からスナップショット名を導出（追加漏れ防止）
          SNAPSHOTS=$(grep -oE 'toHaveScreenshot\("[^"]+\.png"' e2e/vrt.spec.ts | sed -E 's/.*toHaveScreenshot\("([^"]+)\.png"/\1/')
          for name in $SNAPSHOTS; do
            snapshot="${name}-chromium-linux.png"
            # PRのスナップショットをダウンロード
            # cf r2 objects get は本文を stdout に書くため、失敗時はリダイレクトで生じた空ファイルを消す
            pnpm exec cf r2 objects get snapshots/pr-${PR_NUM}/${snapshot} --bucket-name ${{ env.R2_BUCKET }} > /tmp/${snapshot} || {
              rm -f /tmp/${snapshot}
              echo "Snapshot ${snapshot} not found for PR #${PR_NUM}, skipping..."
              continue
            }
            # ベースラインとしてアップロード
            pnpm exec cf r2 objects put baselines/${snapshot} --bucket-name ${{ env.R2_BUCKET }} --file /tmp/${snapshot} --content-type image/png
            echo "Updated baseline: ${snapshot}"
          done

          echo "Baselines updated successfully from PR #${PR_NUM}"
