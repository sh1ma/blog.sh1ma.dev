name: Staging Deploy

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "lib/**"
      - "seed/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "cloudflare.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tailwind.config.ts"
      - "tsconfig.json"
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ENV: staging
  SITE_URL: https://blog-staging.${{ secrets.WORKERS_SUBDOMAIN }}.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cf deploy --prebuilt --dry-run --mode staging

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || vars.EMDASH_STAGING_READY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check EmDash migrations on staging D1
        run: pnpm exec emdash migrate --check --wrangler-config wrangler.jsonc --wrangler-env staging --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated staging Worker
        run: pnpm exec cf deploy --prebuilt --mode staging
